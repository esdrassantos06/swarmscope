name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Swarmscope-macos-arm64
            package: dmg
          - os: macos-15-intel
            artifact: Swarmscope-macos-intel
            package: zip
          - os: windows-latest
            artifact: Swarmscope-windows-x64
            package: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest

      - run: uv run python build.py

      - name: Disk image for Apple Silicon
        if: matrix.package == 'dmg'
        run: |
          mkdir dmg
          cp -R dist/Swarmscope.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Swarmscope -srcfolder dmg -ov -format UDZO ${{ matrix.artifact }}.dmg

      - name: Zip Intel Mac app
        if: runner.os == 'macOS' && matrix.package == 'zip'
        run: ditto -c -k --keepParent dist/Swarmscope.app ${{ matrix.artifact }}.zip

      - name: Zip Windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Swarmscope -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.package }}

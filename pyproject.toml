[project]
name = "swarmscope"
version = "0.1.0"
description = "Desktop load tester for your own sites, built on Locust"
requires-python = ">=3.11"
dependencies = [
    "locust>=2.47",
    "patchright>=1.64.4",
    "psutil>=7.2.2",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "ruff>=0.17.3",
    "taskipy>=1.2.1",
]

[tool.uv]
package = false

[tool.taskipy.settings]
cwd = "."

[tool.taskipy.tasks]
dev = "python app.py"
build = "python build.py"
open = "python -c 'import build; build.open_app()'"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PLW1510", "BLE"]
# The formatter owns line length; long strings and docstrings are left as written.
ignore = ["E501"]
